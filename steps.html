<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alpha Steps</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    background: #080b14;
    color: white;
    font-family: Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
}

.card {
    width: 100%;
    max-width: 420px;
    padding: 25px;
    background: #111827;
    border: 1px solid #263449;
    border-radius: 20px;
}

h1 {
    color: #58a6ff;
    text-align: center;
}

.subtitle {
    color: #9ca3af;
    text-align: center;
    margin-bottom: 25px;
}

.step {
    background: #1a2435;
    border: 1px solid #29374d;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 15px;
}

.step h3 {
    margin-top: 0;
    color: #60a5fa;
}

.step p {
    color: #b9c4d3;
    line-height: 1.6;
}

.btn {
    display: block;
    text-align: center;
    background: #1677ff;
    color: white;
    padding: 14px;
    border-radius: 12px;
    text-decoration: none;
    margin-top: 20px;
    font-weight: bold;
}

.footer {
    text-align: center;
    color: #667085;
    font-size: 12px;
    margin-top: 20px;
}
</style>
</head>

<body>

<div class="card">

<h1>ALPHA</h1>
<div class="subtitle">Step-by-Step Guide</div>

<div class="step">
<h3>Step 1</h3>
<p>Welcome to the Alpha website. Read the instructions carefully.</p>
</div>

<div class="step">
<h3>Step 2</h3>
<p>Explore the website and check the information provided on each page.</p>
</div>

<div class="step">
<h3>Step 3</h3>
<p>Continue to the next page when you are ready.</p>
</div>

<a href="index.html" class="btn">← Back to Home</a>

<div class="footer">
ALPHA • OFFICIAL WEBSITE
</div>

</div>

</body>
</html>
